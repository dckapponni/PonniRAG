name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Lint, format, and secret scanning
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint dependencies
        run: pip install black isort flake8 flake8-docstrings

      - name: Black (format check)
        run: black --check --diff src/

      - name: isort (import order check)
        run: isort --check --diff src/

      - name: flake8 (style + docstrings)
        run: flake8 src/

      - name: Gitleaks (secret detection)
        run: |
          wget -qO gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --verbose

  # ──────────────────────────────────────────────
  # Stage 2: Tests with coverage
  # ──────────────────────────────────────────────
  tests:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        working-directory: src
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:report/coverage.xml \
            -v \
            --tb=short \
            -x

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/report/coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────
  # Stage 3: Docker build verification
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          docker system prune -af --volumes || true
          docker builder prune -af || true
          df -h /

      - name: Build API image
        run: docker build -t ponni-api -f Dockerfile.api .

      - name: Build Frontend image
        run: docker build -t ponni-frontend -f frontend/Dockerfile ./frontend

      - name: Verify docker-compose config
        run: docker compose config --quiet

      - name: Report disk usage
        if: always()
        run: df -h /

      - name: Clean up images
        if: always()
        run: docker system prune -af --volumes || true
